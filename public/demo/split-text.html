<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쪼갠 텍스트 · 배치도 데모</title>
<!--
  데모 페이지: 글자·단어 단위로 쪼갠 애니메이션 텍스트와 투명 래퍼 안의 canvas가 있는 페이지의 배치도(layoutMap, DETECTION_RULES 16장) 확인용 검사 대상이다.
  Fixture가 아니므로 pnpm test:fixtures의 판정에 넣지 않는다. 미리 보기만 한다:
    pnpm test:fixtures --page demo/split-text.html --report-only

  /fonts/의 Noto Sans KR을 @font-face로 쓰고 외부 리소스와 JS가 없다(AGENTS.md 7.1).

  구성 (3D 포트폴리오 사이트에서 본 구조를 줄여 옮겼다):
  - main 안에 같은 크기의 section(페이지 전체를 감싼다). 배치도에서 하나로 합쳐져 label이 "main · section"이 된다.
    첫 화면 section 안의 div[role=region]도 section과 같은 크기라 합쳐진다.
  - 전체 화면 canvas: aria-hidden 래퍼 안, 투명(opacity 0)에서 나타나는 래퍼 안. 탐지 후보에서는 빠지지만 배치도에는 나와야 한다.
  - 글자 단위로 쪼갠 큰 제목: h1[aria-label] > span(줄, block) > span(글자, inline-block, aria-hidden). Mobile용 사본은 display: none.
  - 단어 단위로 쪼갠 버튼 텍스트: a > span(단어, inline-block)
  - <br>로 줄을 나눈 h2가 있는 일반 섹션 2개
  기대: 이슈 0개. 배치도에 text 막대가 글자마다 생기지 않고, canvas 블록이 있다.
-->
<style>
  @font-face {
    font-family: 'Noto Sans KR';
    src: url('/fonts/NotoSansKR-Regular.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: block;
  }

  @font-face {
    font-family: 'Noto Sans KR';
    src: url('/fonts/NotoSansKR-Bold.ttf') format('truetype');
    font-weight: 700;
    font-style: normal;
    font-display: block;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  body,
  body * {
    font-family: 'Noto Sans KR';
  }

  body {
    margin: 0;
    color: #0f172a;
    background: #f8fafc;
    font-size: 16px;
    line-height: 1.6;
  }

  .hero {
    position: relative;
    height: 100vh;
    min-height: 640px;
    overflow: hidden;
  }

  .hero-inner {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 56px;
  }

  /* 투명에서 나타나는 래퍼. 측정 시점의 opacity와 관계없이 canvas가 배치도에 나와야 한다 */
  .scene-fade {
    position: absolute;
    inset: 0;
    opacity: 0;
    animation: fade-in 8s ease-out 2s forwards;
  }

  @keyframes fade-in {
    to {
      opacity: 1;
    }
  }

  .scene-fade > div {
    height: 100%;
  }

  .scene-fade canvas {
    display: block;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 70% 40%, #c7d2fe, #f8fafc 70%);
  }

  .hero-title {
    position: relative;
    margin: 0 0 40px;
    font-size: 96px;
    line-height: 1.1;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  .line {
    display: block;
  }

  .char {
    display: inline-block;
  }

  .title-mobile {
    display: none;
  }

  .cta {
    position: relative;
    align-self: flex-start;
    display: inline-flex;
    gap: 6px;
    padding: 12px 22px;
    border-radius: 999px;
    background: #0f172a;
    color: #fff;
    text-decoration: none;
  }

  .word {
    display: inline-block;
  }

  .plain {
    padding: 96px 56px;
  }

  .plain h2 {
    margin: 0 0 24px;
    font-size: 48px;
    line-height: 1.2;
  }

  .plain p {
    max-width: 640px;
    margin: 0 0 16px;
  }

  @media (max-width: 600px) {
    .hero-inner {
      padding: 0 20px;
    }

    .hero-title {
      font-size: 48px;
    }

    .title-desktop {
      display: none;
    }

    .title-mobile {
      display: block;
    }

    .plain {
      padding: 64px 20px;
    }

    .plain h2 {
      font-size: 32px;
    }
  }
</style>
</head>
<body>
  <main>
   <section class="page">
    <section class="hero" aria-labelledby="hero-title">
      <div class="scene-fade">
        <div aria-hidden="true">
          <canvas width="1440" height="900"></canvas>
        </div>
      </div>
      <div class="hero-inner" role="region" aria-label="소개">
        <h1 class="hero-title" id="hero-title" aria-label="Create beyond imagination.">
          <span class="title-desktop">
            <span class="line"><span class="char" aria-hidden="true">C</span><span class="char" aria-hidden="true">r</span><span class="char" aria-hidden="true">e</span><span class="char" aria-hidden="true">a</span><span class="char" aria-hidden="true">t</span><span class="char" aria-hidden="true">e</span>&nbsp;<span class="char" aria-hidden="true">b</span><span class="char" aria-hidden="true">e</span><span class="char" aria-hidden="true">y</span><span class="char" aria-hidden="true">o</span><span class="char" aria-hidden="true">n</span><span class="char" aria-hidden="true">d</span></span>
            <span class="line"><span class="char" aria-hidden="true">i</span><span class="char" aria-hidden="true">m</span><span class="char" aria-hidden="true">a</span><span class="char" aria-hidden="true">g</span><span class="char" aria-hidden="true">i</span><span class="char" aria-hidden="true">n</span><span class="char" aria-hidden="true">a</span><span class="char" aria-hidden="true">t</span><span class="char" aria-hidden="true">i</span><span class="char" aria-hidden="true">o</span><span class="char" aria-hidden="true">n</span><span class="char" aria-hidden="true">.</span></span>
          </span>
          <span class="title-mobile">
            <span class="line"><span class="char" aria-hidden="true">C</span><span class="char" aria-hidden="true">r</span><span class="char" aria-hidden="true">e</span><span class="char" aria-hidden="true">a</span><span class="char" aria-hidden="true">t</span><span class="char" aria-hidden="true">e</span></span>
            <span class="line"><span class="char" aria-hidden="true">b</span><span class="char" aria-hidden="true">e</span><span class="char" aria-hidden="true">y</span><span class="char" aria-hidden="true">o</span><span class="char" aria-hidden="true">n</span><span class="char" aria-hidden="true">d</span></span>
            <span class="line"><span class="char" aria-hidden="true">i</span><span class="char" aria-hidden="true">m</span><span class="char" aria-hidden="true">a</span><span class="char" aria-hidden="true">g</span><span class="char" aria-hidden="true">i</span><span class="char" aria-hidden="true">n</span><span class="char" aria-hidden="true">a</span><span class="char" aria-hidden="true">t</span><span class="char" aria-hidden="true">i</span><span class="char" aria-hidden="true">o</span><span class="char" aria-hidden="true">n</span><span class="char" aria-hidden="true">.</span></span>
          </span>
        </h1>
        <a class="cta" href="#product"><span class="word">Start</span> <span class="word">creating</span> <span class="word" aria-hidden="true">↗</span></a>
      </div>
    </section>

    <section class="plain" id="product">
      <h2>Ideas need<br>a place to go.</h2>
      <p>떠오른 생각을 바로 장면으로 옮기고, 여러 각도에서 살펴본 뒤 팀과 함께 다듬습니다.</p>
      <p>작업 기록은 자동으로 저장되어 언제든 이전 장면으로 돌아갈 수 있습니다.</p>
    </section>

    <section class="plain" id="features">
      <h2>See it from<br>every angle.</h2>
      <p>장면마다 조명과 시점을 바꿔 보며 가장 좋은 구도를 고릅니다.</p>
    </section>
   </section>
  </main>
</body>
</html>
