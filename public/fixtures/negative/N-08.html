<!--
  Fixture: N-08 (Negative)

        DETECTION_RULES 4.1("texts is empty → continue"), 6.2, 12.2

  의도:
  - 기사 카드(data-testid="n08-card-1~2")는 border-radius + overflow: hidden이다.
  - 카드 안 이미지(data-testid="n08-image-1~2")는 카드보다 30% 넓고 좌우로 15%씩 튀어나오게
    배치해(object-fit 대신 넓은 이미지를 가운데 정렬) 카드 경계에서 잘린다.
    카드의 scrollWidth가 clientWidth보다 크지만, 넘친 것은 이미지뿐이고 텍스트는 카드 padding box
    안에 있으므로 clipped가 아니다.
  - Mobile에서 이미지 왼쪽 끝은 화면 왼쪽 밖(음수 x)이다. 카드가 가로 클립 조상이므로 Viewport
    Overflow에서 제외된다.
  - 이미지는 가로로만 넘치고 세로 높이는 고정이라, 카드 안 텍스트와 겹치지 않는다.
  - 카드는 세로로 한 줄씩 쌓는다. 옆에 다른 카드를 두면 잘려서 보이지 않는 이미지 부분(rect는
    잘리기 전 크기)이 옆 카드와 겹친 것으로 측정될 수 있기 때문이다(보고서 참고).

  기대 결과: 이슈 0개 (needsReview: true인 이슈는 허용)
-->
