<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P-02 · Mobile에서만 잘리는 버튼 텍스트</title>
<!--
  Fixture: P-02 (Positive)
  검증: PRD 5.3.2(clipped), 5.5.3(clipped 인터랙티브 행, Reach 보정), 5.6(mobile-only), 13.1
        DETECTION_RULES 4.1, 9.1 3행, 9.2, 12.2

  의도:
  - CTA 버튼(data-testid="p02-cta-button")은 overflow: hidden + white-space: nowrap이다.
  - Desktop에서는 너비 320px이라 문구가 다 들어간다.
  - Mobile(max-width: 480px)에서는 media query로 너비를 180px로 줄여 문구 오른쪽이 잘린다.
    잘린 문구의 오른쪽 끝(약 255px)은 화면(390px) 안이라 Viewport Overflow는 생기지 않는다.
  - 버튼은 문서 y ≥ 900px에 둔다(.features의 min-height). Mobile 첫 화면(844px) 밖이므로
    Reach +1이 붙지 않는다(PRD 13.1 P-02 배치 조건).
  - 버튼 자신이 overflow: hidden이므로 spill로는 잡히지 않는다(DETECTION_RULES 4.2).

  기대 결과: text-overflow / clipped 1개, 대상 p02-cta-button, P1, mobile-only

  Priority 계산 (PRD 5.5.3 3행: clipped + 인터랙티브):
  - S=4, I=4, base R=3
  - Reach: 버튼 y ≥ 900 ≥ Mobile innerHeight 844 → +0, Mobile에서만 발생 → +0
  - R = 3
  - score100 = 4×35 + 4×35 + 3×30 = 370 → P1
-->
<link rel="stylesheet" href="/fixtures/assets/base.css">
<style>
  /* 첫 화면 아래로 CTA를 내리기 위한 기능 소개 영역. 높이를 고정해 두 viewport 모두 y ≥ 900을 보장한다. */
  .features {
    min-height: 900px;
  }

  .feature-list {
    margin: 16px 0 0;
    padding: 0;
    list-style: none;
  }

  .feature-list li + li {
    margin-top: 16px;
  }

  .cta {
    padding-top: 8px;
  }

  .cta p {
    margin: 8px 0 16px;
    color: #57606a;
  }

  .cta-button {
    width: 320px;
    /* 의도한 문제: 한 줄 고정 + 잘림 */
    white-space: nowrap;
    overflow: hidden;
  }

  @media (max-width: 480px) {
    .cta-button {
      width: 180px;
    }
  }
</style>
</head>
<body>
  <header class="site-header"><span class="brand">팀 메신저</span></header>

  <main class="page">
    <section>
      <h1>팀 대화를 한곳에서</h1>
      <p class="lead">흩어진 메신저와 메일을 하나로 모으고, 중요한 결정을 놓치지 않게 정리해 드립니다.</p>
    </section>

    <section class="features">
      <h2>주요 기능</h2>
      <ul class="feature-list">
        <li>채널별 알림을 시간대에 맞춰 받을 수 있습니다.</li>
        <li>회의 내용을 자동으로 요약해 채널에 남깁니다.</li>
        <li>파일과 링크를 대화 안에서 바로 검색합니다.</li>
        <li>외부 협력사와 안전하게 공유 채널을 만들 수 있습니다.</li>
      </ul>
    </section>

    <section class="cta">
      <h2>지금 시작해 보세요</h2>
      <p>신용카드 없이 14일 동안 모든 기능을 써 볼 수 있습니다.</p>
      <button type="button" class="btn cta-button" data-testid="p02-cta-button">지금 바로 무료 체험 시작하기</button>
    </section>
  </main>
</body>
</html>
