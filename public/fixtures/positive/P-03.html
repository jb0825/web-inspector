<title>P-03 · 겹친 absolute 버튼 두 개</title>
<!--
  Fixture: P-03 (Positive)
  검증: PRD 5.3.3(Element Overlap, 인터랙티브 예외), 5.5.3(인터랙티브 겹침 행), 5.5.4, 13.1
        DETECTION_RULES 5.4~5.6, 7.3, 9.1 2행, 9.2, 12.2

  의도:
  - 같은 부모(.form-actions, position: relative) 안에 position: absolute 버튼 두 개가 있다.
    "저장하기"(data-testid="p03-button-save")는 left 0, "취소"(data-testid="p03-button-cancel")는
    left 64px / top 8px라 서로 약 27×36px 겹친다(약 970px², 작은 버튼 면적의 약 36%. T03 측정값).
  - 둘 다 absolute이고 부모 안에 있지만, 두 요소가 모두 인터랙티브라 Confidence를 낮추지 않는다
    (PRD 5.3.3 예외).
  - 배치가 viewport와 무관하므로 Desktop과 Mobile 모두에서 같은 겹침이 생기고, data-testid로
    매칭되어 이슈 1개(both)로 합쳐진다(PRD 5.3.5 규칙 3, 5.6).
  - 대상 요소는 문서 순서가 앞인 "저장하기", 상대 요소는 "취소"다(DETECTION_RULES 5.6).

  기대 결과: element-overlap / interactive 1개, 대상 p03-button-save, 상대 p03-button-cancel,
             P0, both, Confidence 1.0

  Priority 계산 (PRD 5.5.3 2행: 인터랙티브끼리 겹침):
  - S=5, I=4, base R=3
  - Reach: 버튼 y(약 300px) < innerHeight(900 / 844) → +1, 두 viewport 모두 발생 → +1
  - R = min(3+2, 5) = 5
  - score100 = 5×35 + 4×35 + 5×30 = 465 → P0
-->
<link rel="stylesheet" href="/fixtures/assets/base.css">
<style>
  .form-card {
    max-width: 480px;
    padding: 20px;
    border: 1px solid #d0d7de;
    border-radius: 12px;
  }

  .form-card p {
    margin-top: 8px;
    color: #57606a;

  .form-actions {
    position: relative;

    position: absolute;
  }

  .action-save {
    left: 0;
    top: 0;
  }

    left: 64px;
    top: 8px;
    background: #6e7781;
  }
</style>

<body>
  <header class="site-header"><span class="brand">프로필 설정</span></header>

  <main class="page">
    <section class="form-card">
      <h2>변경 사항 저장</h2>

      <div class="form-actions">
        <button type="button" class="btn action-save" data-testid="p03-button-save">저장하기</button>
        <button type="button" class="btn action-cancel" data-testid="p03-button-cancel">취소</button>
      </div>
    </section>

    <section class="filler">

    </section>
