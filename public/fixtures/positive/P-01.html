<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P-01 · Mobile에서 600px 고정 박스</title>
<!--
  Fixture: P-01 (Positive)
  검증: PRD 5.3.4(page-scroll, 원인 요소 특정), 5.3.5 규칙 1(원인 요소만 보고), 5.5.3, 13.1
        DETECTION_RULES 6.3(원인 요소), 6.4(subtype), 7.3(viewportTag), 9.1~9.3, 12.2

  의도:
  - 요금제 표(data-testid="p01-fixed-box")가 width: 600px로 고정되어 있다.
  - Desktop(layoutWidth 1440)에서는 화면 안이고, Mobile(layoutWidth 390)에서는 오른쪽으로 226px 넘쳐
    페이지 가로 스크롤이 생긴다.
  - 표 안의 자식(p01-plan-1~3, 그 안의 h3/p)도 화면 밖으로 나가지만 부모(표)가 이미 밖이므로
    원인이 아니다. 원인 요소는 "부모는 화면 안, 자신은 밖"인 표 1개뿐이다(affectedDescendants로만 기록).

  기대 결과: viewport-overflow / page-scroll 1개, 대상 p01-fixed-box, P0, mobile-only

  Priority 계산 (PRD 5.5.3 1행, DETECTION_RULES 9.1~9.3):
  - S=4, I=4, base R=5
  - Reach: 표의 y(약 180px) < Mobile innerHeight 844 → +1, Mobile에서만 발생 → +0
  - R = min(5+1, 5) = 5
  - score100 = 4×35 + 4×35 + 5×30 = 430 → P0
-->
<link rel="stylesheet" href="/fixtures/assets/base.css">
<style>
  .plan-table {
    /* 의도한 문제: 반응형이 아닌 고정 너비 */
    width: 600px;
    display: flex;
    gap: 12px;
    padding: 16px;
    border: 1px solid #d0d7de;
    border-radius: 12px;
    background: #f6f8fa;
  }

  .plan {
    flex: 1 1 0;
    min-width: 0;
    padding: 12px;
    border-radius: 8px;
    background: #ffffff;
  }

  .plan p {
    color: #57606a;
    font-size: 15px;
  }
</style>
</head>
<body>
  <header class="site-header"><span class="brand">요금제 안내</span></header>

  <main class="page">
    <section>
      <h1>요금제 한눈에 보기</h1>
      <p class="lead">팀 규모에 맞는 요금제를 고르세요. 모든 요금제는 14일 동안 무료로 써 볼 수 있습니다.</p>
    </section>

    <div class="plan-table" data-testid="p01-fixed-box">
      <div class="plan" data-testid="p01-plan-1">
        <h3>베이직</h3>
        <p>월 9,900원</p>
      </div>
      <div class="plan" data-testid="p01-plan-2">
        <h3>프로</h3>
        <p>월 19,900원</p>
      </div>
      <div class="plan" data-testid="p01-plan-3">
        <h3>팀</h3>
        <p>월 49,900원</p>
      </div>
    </div>

    <section class="filler">
      <h2>자주 묻는 질문</h2>
      <p>요금제는 언제든지 바꿀 수 있습니다. 상위 요금제로 바꾸면 남은 기간만큼 일할 계산된 금액이 청구됩니다.</p>
      <p>결제 수단은 카드와 계좌이체를 지원합니다. 세금계산서가 필요하면 결제 화면에서 사업자 정보를 입력해 주세요.</p>
    </section>
  </main>
</body>
</html>
